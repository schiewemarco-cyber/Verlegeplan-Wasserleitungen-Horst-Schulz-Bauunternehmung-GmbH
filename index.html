<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verlegeplan-Editor</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b6bcb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verlegeplan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#d9dee6;--ac:#0b6bcb;--line:#1b2430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b2129;--tx:#e8ecf1;--mu:#9aa6b5;--bd:#303845;--ac:#5aa7ff;--line:#e8ecf1}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b2129;--tx:#e8ecf1;--mu:#9aa6b5;--bd:#303845;--ac:#5aa7ff;--line:#e8ecf1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
input,select,button{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
input{width:110px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.sc{overflow:auto;max-height:56vh}.stick{position:sticky;top:0;z-index:30;max-height:46vh;overflow:auto;padding:8px 10px}.stick h2{margin-bottom:4px}
ol{margin:0;padding-left:22px}li{margin:3px 0}li button{padding:1px 6px;margin-left:4px}
table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--bd)}
svg text{fill:var(--tx);font-family:system-ui,sans-serif}
@media (pointer:coarse){.card input,.card select,.card button,.pvbar button{min-height:44px;font-size:16px;padding:8px 12px}.card li button{min-width:44px;padding:8px 10px}.sc{-webkit-overflow-scrolling:touch}}
#pv{display:none;position:fixed;inset:0;background:#555;overflow:auto;z-index:50;padding:56px 0 20px}
#pv.on{display:block}
.pvbar{position:fixed;top:0;left:0;right:0;background:#222;color:#fff;padding:8px 12px;display:flex;gap:8px;align-items:center;z-index:60;font-size:13px}
.pg{--tx:#000;--line:#000;--card:#fff;--mu:#555;--bd:#999;--bg:#eee;background:#fff;color:#000;margin:0 auto 20px;position:relative;box-shadow:0 2px 12px #0008;font-family:system-ui,sans-serif}
.pg1{width:420mm;height:296mm;overflow:hidden}.pg2{width:210mm;min-height:296mm;padding:14mm}
.frame{position:absolute;inset:10mm;border:.6mm solid #000}
.draw{position:absolute;left:4mm;right:4mm;top:4mm;bottom:70mm;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tb{position:absolute;right:0;bottom:0;width:178mm;border-top:.6mm solid #000;border-left:.6mm solid #000;background:#fff;font-size:12px}
.tb .r{display:flex;border-top:.3mm solid #000}.tb .r:first-child{border-top:0}
.tb .c{flex:1;padding:1mm 2mm;border-left:.3mm solid #000;min-height:9mm}.tb .c:first-child{border-left:0}
.tb small{display:block;font-size:9px;color:#444}.tb b{font-size:14px;font-weight:500}
.leg{position:absolute;right:181mm;bottom:3mm;font-size:12px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}.lg{display:flex;align-items:center;gap:6px}
.bt{border-collapse:collapse;width:100%}.bt th,.bt td{border:1px solid var(--bd);padding:5px 8px;text-align:left}.bt th{background:var(--bg)}
@page plan{size:A3 landscape;margin:0}@page lst{size:A4 portrait;margin:0}
.pg1{page:plan}.pg2{page:lst}
@media print{.noprint{display:none}body>*:not(#pv){display:none!important}body{background:#fff;padding:0;max-width:none;margin:0}#pv{position:static;display:block!important;background:none;padding:0;overflow:visible}.pvbar{display:none}#pvin{zoom:1!important}.pg{margin:0;box-shadow:none;break-after:page}}
</style></head><body>
<h1>Verlegeplan-Editor</h1>
<div class="card noprint">
 <div class="row">
  <label>Bauvorhaben<input id="bv" style="width:170px"></label>
  <label>Straße<input id="str" style="width:140px"></label>
  <label>Kostenstelle<input id="ks" style="width:110px"></label>
  <label>Ausführungszeitraum<input id="zr" style="width:170px" placeholder="z. B. KW 12–15/2026"></label>
  <label>Hauptleitung (Größe)<span style="display:flex;gap:4px"><select id="unit" onchange="unitCh()" style="width:68px"><option value="DN">DN</option><option value="DA">DA</option></select><input id="dn" type="number" value="150"></span></label>
 </div>
 <div class="row" style="margin-top:8px">
  <label>Baulängen Rohr (m)<input id="bl" value="6; 12" style="width:100px" title="Standard-Baulängen, getrennt mit Semikolon. Jede andere Rohrlänge gilt als Schnitt."></label><button class="p" onclick="save()">💾 Speichern</button>
  <select id="sv" onchange="loadSel()" style="max-width:200px"></select><button onclick="delSel()" title="Gewählten Plan löschen">🗑</button><span id="msg" style="color:var(--ac)"></span>
  <button onclick="demo()">Beispiel laden</button>
  <button onclick="S.items=[];S.act=[];S.sel=null;S.ins=null;S.bo={};S.bx=[];draw()">Leeren</button>
  <button onclick="undo()" title="Strg+Z">↶ Rückgängig</button><button onclick="redo()" title="Strg+Y">↷ Wiederholen</button>
  <button class="p" onclick="preview()">Druckvorschau</button>
  <button onclick="$('pdfin').click()">📂 PDF laden</button><input type="file" id="pdfin" accept="application/pdf,.pdf" style="display:none" onchange="pdfLoad(this)">
 </div>
</div>
<div class="card noprint stick">
 <h2>Element anfügen an: <span id="cur" style="color:var(--ac)"></span></h2>
 <div class="row">
  <label>Typ<select id="type" onchange="fields()">
   <option value="rohr">Rohr</option><option value="tee">T-Stück</option><option value="hydt">T-Stück mit Hydrant</option><option value="kos">KOS</option><option value="eu">EU</option><option value="vb">VB</option><option value="winkel">Winkel</option><option value="nstueck">N-Stück</option><option value="ff">FF-Stück</option><option value="anb">Anbindung</option><option value="ffr">FFR (Reduzierstück)</option><option value="ufh">UFH</option><option value="best">Bestand (gestrichelt)</option></select></label>
  <label id="fl">Länge (m)<input id="len" type="number" value="12" step="0.1"></label>
  <label id="rdl">Größe durchgehend<input id="rdn" type="number" placeholder="wie Leitung" list="dns" style="width:120px"></label>
  <label id="dul">Einheit<select id="dun" style="width:78px"><option>DN</option><option>DA</option></select></label>
  <label id="unl">Einheit Abzweig/FFR<select id="eun" style="width:78px"><option>DN</option><option>DA</option></select></label>
  <span id="bgf" class="row" style="display:none"><label id="angl">Winkel (11–90°)<input id="ang" type="number" value="45" min="11" max="90" step="0.5"></label><label>Richtung<select id="bdir"><option value="-1">links</option><option value="1">rechts</option></select></label></span>
  <span id="tee" class="row" style="display:none">
   <label>Richtung<select id="dir"><option value="-1">links</option><option value="1">rechts</option></select></label>
   <label>Abzweig-Name<input id="bn" placeholder="Kuckucksweg"></label>
   <label>Größe Abzweig<input id="bdn" type="number" value="80" list="dns"></label><datalist id="dns"><option>80</option><option>100</option><option>150</option><option>200</option></datalist>
  </span>
  <span id="ffr" class="row" style="display:none"><label>Größe nach FFR<input id="fdn" type="number" value="100" list="dns"></label></span>
  <label>Bezeichnung (optional)<input id="lbl" placeholder="eigener Name" style="width:150px"></label>
  <button class="p" onclick="add()">Hinzufügen</button>
 </div>

 <div class="row noprint" style="margin-top:8px;align-items:center"><button id="ptsb" onclick="ptsMode()" title="Orange Plus-Punkte zwischen allen Bauteilen anzeigen">＋ Einfügepunkte</button><button id="cutb" onclick="cutMode()" title="Rote Rohrschnitt-Striche frei am Rohr setzen">✂ Rohrschnitt</button><button id="freeb" onclick="freeMode()" title="Eigene Markierung mit Namen frei am Rohr setzen">◆ Freie Belegung</button><input id="fnm" placeholder="Name der Belegung" style="width:150px"><span style="color:var(--mu)">Blauer Kreis = dort weiterbauen. Richtung am gewählten Ende:</span><span id="arr" class="row"></span></div>
 <div class="row noprint" id="ed" style="margin-top:6px;min-height:44px;align-items:center"></div>
</div>
<div class="card"><h2 style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">Skizze (schematisch, nicht maßstäblich) <span class="noprint" style="margin-left:auto;display:flex;gap:4px"><button onclick="zoom(1/1.25)">−</button><button onclick="zfit()">Anpassen</button><button onclick="zoom(1.25)">＋</button></span></h2>
 <div class="sc" id="sk"></div></div>
<div class="row" style="align-items:start">
 <div class="card noprint" style="flex:1;min-width:260px"><h2>Reihenfolge</h2><ol id="ls"></ol></div>
 <div class="card" style="flex:1;min-width:260px"><h2>Stückliste</h2><div id="bom"></div>
 <div class="row noprint" style="margin-top:8px"><input id="bxn" placeholder="Eigene Position" style="width:150px"><input id="bxq" type="number" value="1" step="any" style="width:70px"><input id="bxu" placeholder="Stk" style="width:60px"><button onclick="bxA()">＋ Position</button></div></div>
</div>
